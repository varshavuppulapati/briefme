<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BriefMe — Meeting &amp; Lecture Summarizer</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>BriefMe</h1>
  <p>Paste a transcript, or drop in audio or video. Get a TL;DR, key points, action items, and decisions — instantly.</p>
</header>

<main>
  <form id="summarize-form">
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="paste" role="tab">Paste transcript</button>
      <button type="button" class="tab" data-tab="upload" role="tab">Upload audio/video</button>
    </div>

    <div class="tab-panel" data-panel="paste">
      <textarea id="transcript" name="transcript" rows="10" placeholder="Paste a meeting or lecture transcript here..."></textarea>
    </div>

    <div class="tab-panel hidden" data-panel="upload">
      <label class="dropzone" id="dropzone" for="media_file">
        <input type="file" id="media_file" name="media" accept=".flac,.mp3,.mp4,.mpeg,.mpga,.m4a,.ogg,.opus,.wav,.webm" hidden>
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4M12 4l-5 5M12 4l5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <span id="dropzone-text">Drag &amp; drop a recording, or click to browse</span>
        <span class="dropzone-hint">mp3, wav, m4a, mp4, webm, flac, ogg, opus</span>
      </label>
    </div>

    <button type="submit" id="submit-btn">
      <span class="btn-label">Summarize</span>
      <span class="spinner hidden" aria-hidden="true"></span>
    </button>
  </form>

  <div id="error" class="alert hidden"></div>

  <section id="results" class="results hidden">
    <h2>TL;DR</h2>
    <p class="tldr" id="tldr"></p>

    <h2>Key points</h2>
    <ul id="key-points"></ul>

    <h2>Action items</h2>
    <ul class="actions" id="action-items"></ul>

    <h2>Decisions made</h2>
    <ul id="decisions"></ul>
  </section>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
